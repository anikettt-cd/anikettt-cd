<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Aniket Saini, Python Backend and Full-Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#1b2a6b"/>
      <stop offset="1" stop-color="#6c47ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" fill="url(#bg)"/>
  <g>
    <path d="M-100 170 C 100 130, 300 210, 500 170 S 900 130, 1100 170 S 1300 190, 1400 170 L1400 220 L-100 220 Z" fill="#ffffff" fill-opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M-100 190 C 150 160, 350 220, 600 190 S 1000 160, 1300 190 L1400 220 L-100 220 Z" fill="#ffffff" fill-opacity="0.06">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="600" y="100" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">
    Aniket Saini
  </text>
  <text x="600" y="148" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="url(#accent)">
    Python Backend &amp; Full-Stack Engineer
  </text>
</svg>
